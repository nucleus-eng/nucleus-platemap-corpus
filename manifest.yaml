# nucleus-platemap-corpus manifest
#
# Each entry records WHY a fixture is in this corpus.
# A file added because it "looks representative" is one nobody maintains.
#
# Fields:
#   path        relative to corpus root once vendored; "pending" if not yet added
#   disclosure  pending | cleared
#   origin      where the file came from
#   instruments list — platereader, microscope, or both
#   plate_format 96 | 384 | etc.
#   added_for   the specific finding or failure mode this file exercises
#   findings    list of expected check results
#     check     the check name in check-platemap.py
#     tier      derived | confirmed | asserted
#               derived   — correct by construction; always gates CI
#               confirmed — human-verified against the real data; gates CI
#               asserted  — one agent's output, not independently verified; never gates CI
#     expected  blocking | warn | info | pass
#
# Tiers derived and confirmed may fail a build.
# Tier asserted never gates CI — it records a hypothesis, not a fact.

corpus:

  # ── Real fixtures (staged for disclosure) ─────────────────────────────────

  - path: pending
    disclosure: pending
    origin: "bench sheet, ClpXP kinetics run, 2026-09"
    instruments: [platereader]
    plate_format: 384
    added_for: >
      Cells rows uniformly rescaled ÷3 from source (30 µL → 10 µL).
      Concentrations survive the rescaling so every arithmetic check passes,
      but the recorded volumes are not what was pipetted. Caught by
      cross-comparison between two agents' outputs, not by any check.
    findings:
      - check: undeclared_uniform_volume_ratio
        tier: confirmed
        expected: blocking
      - check: well_coverage
        tier: confirmed
        expected: pass

  - path: pending
    disclosure: pending
    origin: "bench sheet, 2026-08"
    instruments: [platereader]
    plate_format: 96
    added_for: >
      13 of 20 wells present in the plate grid were absent from the written
      condition table. The CDK inner join would have analysed one third of
      the run and reported nothing wrong. No error is raised.
    findings:
      - check: well_coverage
        tier: confirmed
        expected: blocking

  - path: pending
    disclosure: pending
    origin: "Notion ELN, 2026-09"
    instruments: [platereader]
    plate_format: 96
    added_for: >
      Type column contains "Standard" meaning "the standard prep method".
      The CDK reads this as a calibration standard and excludes those wells
      from kinetics. Passes every syntactic check; silently wrong.
    findings:
      - check: type_value_semantic
        tier: asserted
        expected: blocking

  - path: pending
    disclosure: pending
    origin: "Notion ELN, 2026-09"
    instruments: [platereader]
    plate_format: 96
    added_for: >
      Recipe column headed "Volume for one reaction [µL]" sums to 35 µL
      for a declared 10 µL reaction. Six of nine components disagree with
      the stated basis when back-calculated. Mg-Acetate implies 28 mM
      against a stated 8 mM.
    findings:
      - check: recipe_volume_sum
        tier: confirmed
        expected: blocking

  - path: fixtures/real/dry-run-platemap-date-increment.csv
    source_xlsx: fixtures/real/dry-run-platemap-date-increment.xlsx
    disclosure: cleared
    origin: "dry-run platemap, 2026-09-01"
    instruments: [platereader]
    plate_format: 96
    added_for: >
      First CDK-format platemap in the corpus (Date, Experiment, Well,
      Name, Type, Rxn Volume columns). Date column increments one day per
      row (2026-09-01 through 2026-09-09) across a single experiment —
      the check-platemap.py finding from the PR. Also has mixed structure:
      recipe tables embedded below the platemap rows in the same sheet.
      Placeholder concentration in component name ("XX conc.").
      Second sheet (platemap-2-claude) is empty — the before/after
      workflow target for build-platemap.
    findings:
      - check: date_column_monotonic
        tier: confirmed
        expected: blocking
        note: "9 consecutive dates across 9 rows of a single experiment"
      - check: mixed_platemap_and_recipe_in_sheet
        tier: confirmed
        expected: warn
        note: "recipe tables begin at row 11 in the same sheet as the platemap"
      - check: placeholder_in_component_name
        tier: asserted
        expected: warn
        note: "pOpen-T7-deGFP (XX conc.) — concentration not filled in"

  - path: fixtures/real/tetR-atc-liposome-grid-platemap.csv
    source_xlsx: fixtures/real/tetR-atc-liposome-grid.xlsx
    disclosure: cleared
    origin: "Liposomes in M9 media Test 05, 2025-02-27"
    instruments: [platereader]
    plate_format: 96
    added_for: >
      Grid-format platemap (platemap-2 sheet) — exercises grid-to-platemap.py.
      Multiple stacked attribute grids (condition, [tetR], [aTc], aTc OS/IS,
      lipids, OS-glucose, DNA volume) over a partial plate (columns 2–7,
      rows A–E, with C3–C7 unused and D/E rows having N/A for liposome
      attributes). First file with explicit, well-structured IS/OS labelling
      (aTc OS/IS column) — the correct counterpart to the ambiguous case in
      clpxp-nucleus-cytosol-bulk-and-cells.csv.
    findings:
      - check: grid_to_platemap_parseable
        tier: confirmed
        expected: pass
      - check: well_coverage
        tier: confirmed
        expected: pass
        note: "C3–C7 empty cells are legitimately unused wells, not missing data"

  - path: fixtures/real/tetR-atc-liposome-grid-build.csv
    source_xlsx: fixtures/real/tetR-atc-liposome-grid.xlsx
    disclosure: cleared
    origin: "Liposomes in M9 media Test 05, 2025-02-27"
    instruments: [platereader]
    plate_format: 96
    added_for: >
      Recipe/build sheet from the same experiment as
      tetR-atc-liposome-grid-platemap.csv. Master mix scaled ~4.4× per-sample
      rather than 4× — intentional dead volume overage, but flaggable by
      scale-recipe.py.
    findings:
      - check: mastermix_scaling_consistency
        tier: asserted
        expected: warn
        note: "4.4× scale factor vs declared 4 reactions — dead volume overage"

  - path: fixtures/real/clpxp-nucleus-cytosol-bulk-and-cells.csv
    disclosure: cleared
    origin: "Notion ELN, ClpXP with Nucleus Cytosol, 2026-06-03 data, dry run 2026-09-01"
    instruments: [platereader]
    plate_format: pending
    added_for: >
      Two-section bench sheet: Bulk (four condition groups, 10 µL each)
      and Cells (30 µL). Exercises two cases: (1) IS/OS compartment
      labelling — the Cells section header reads "Outer solution: 1089 mM
      Glucose" but the table body contains inner-solution components
      (SMix, PMix, Ribosome, tRNA); Optiprep's presence is the tell that
      this is the inner solution, not the outer. (2) Cross-condition
      component variation — ClpP and ClpX appear as purified protein in
      some conditions and as DNA template in others; extract-conditions
      must not collapse these into a single component row.
    findings:
      - check: has_well_column
        tier: confirmed
        expected: pass
        note: "No Well column — source material for extract-conditions"
      - check: compartment_label_consistency
        tier: confirmed
        expected: warn
        note: >
          Cells header says outer solution but body contains inner-solution
          components; Optiprep confirms this is the inner solution
      - check: component_identity_across_conditions
        tier: asserted
        expected: warn
        note: "pOpen-pT7-ClpP-cHis (DNA) vs Purified ClpP (protein) are distinct"

  - path: fixtures/real/clpxp-stacked-bench-sheet.csv
    disclosure: cleared
    origin: "Notion ELN, PPK-energy-module / ClpXP-control-module integration, 2026-01-16 data, dry run 2026-09-01"
    instruments: [platereader]
    plate_format: pending
    added_for: >
      Stacked bench sheet — four recipe tables in one CSV with no Well
      column. Input for extract-conditions, not a platemap yet. Exercises
      three distinct parsing cases: (1) nested master mix (3X Energy Mix
      expands into Energy solution-CP in each reaction — the sub-recipe
      expansion the PR notes as unimplemented); (2) mixed unit notation
      across columns (×, mM, ng/µL, uM, and mm — lowercase mm is likely
      a typo for mM in the PolyP rows); (3) embedded parenthetical in a
      volume cell ("11.67 (3.5 tRNA) (8.17)" documents the breakdown
      inside the value itself).
    findings:
      - check: has_well_column
        tier: confirmed
        expected: pass
        note: >
          No Well column is correct here — this is source material for
          extract-conditions, not a finished platemap.
      - check: unit_consistency
        tier: confirmed
        expected: warn
        note: "mm on PolyP rows is likely a typo for mM"
      - check: nested_mastermix_expansion
        tier: asserted
        expected: warn
        note: "3X Energy Mix sub-recipe not yet expanded by build-platemap"

  # ── Synthetic adversarial cases (no disclosure issue) ─────────────────────
  # Generated by mutating a clean file to trigger one blocking rule each.
  # Tier is derived — correct by construction — so these always gate CI.

  - path: fixtures/synthetic/leading-zero-well.csv
    disclosure: cleared
    origin: "generated"
    added_for: >
      Well IDs with leading zeros (A01 vs A1). The CDK emits A1; a leading
      zero causes a silent inner-join miss with no error reported.
    findings:
      - check: well_id_format
        tier: derived
        expected: blocking

  - path: fixtures/synthetic/off-plate-well.csv
    disclosure: cleared
    origin: "generated"
    plate_format: 96
    added_for: >
      Well ID that does not exist on the declared plate format (e.g. A25 on
      a 96-well plate). Silently dropped by the inner join.
    findings:
      - check: well_id_in_plate
        tier: derived
        expected: blocking

  - path: fixtures/synthetic/duplicate-well.csv
    disclosure: cleared
    origin: "generated"
    added_for: >
      Two rows sharing the same Well value. The join produces duplicate
      result rows with no warning.
    findings:
      - check: duplicate_wells
        tier: derived
        expected: blocking

  # ── Added by nucleus-skills, 2026-09-02 ───────────────────────────────────
  # Synthetic cases for checks the corpus did not yet cover. All verified
  # against check-platemap.py at nucleus-skills@feat/build-platemap-skill --
  # each fires the finding claimed below, and the two that did not fire on
  # first writing were fixed rather than shipped.

  - path: fixtures/synthetic/ambiguous-date.csv
    disclosure: cleared
    origin: "generated"
    added_for: >
      Date written 01/02/25. Month/day or day/month is unrecoverable, and the
      year has no century. Unlike a merely non-standard format this cannot be
      repaired by a later reader, which is why it warrants more than a note.
      The source DevNote names mm/dd/yy and dd/mm/yy explicitly as formats to
      avoid "due to differences in use by country".
    findings:
      - check: date_format
        tier: derived
        expected: warn

  - path: fixtures/synthetic/mixed-date-formats.csv
    disclosure: cleared
    origin: "generated"
    added_for: >
      Two date formats in one platemap. Distinct from a single bad format:
      whichever convention is right, they cannot both be, so at least one row
      is wrong no matter how the file is read.
    findings:
      - check: date_format_consistency
        tier: derived
        expected: warn

  - path: fixtures/synthetic/opaque-sourced-zero.csv
    disclosure: cleared
    origin: "generated"
    added_for: >
      A row using a commercial kit (Sol A/Sol B) carries 0 for [HEPES] and
      [NTP], which that kit supplies. Zero asserts absence; the honest value
      is blank. Every total balances and every concentration is arithmetically
      consistent, so no arithmetic check fires -- the file is wrong in a way
      that looks entirely correct. Two agents produced this error
      independently on the same real experiment from different inputs.
      Detected structurally, with no list of kit names to maintain: a
      concentration column that is zero only on rows containing something no
      other row has.
    findings:
      - check: substituted_zero
        tier: derived
        expected: warn

  - path: fixtures/synthetic/submix-double-counted.csv
    disclosure: cleared
    origin: "generated"
    added_for: >
      A named sub-mix expanded into its components while its own roll-up
      column is kept. Components then sum to 13.33 uL against a stated 10.
      The fix is that the parts REPLACE the roll-up; the roll-up survives as
      provenance, not as a volume.
    findings:
      - check: nested_mastermix_expansion
        tier: derived
        expected: warn

  # ── Real fixtures held for disclosure ─────────────────────────────────────

  - path: pending
    disclosure: pending
    origin: "ELN page, PPK energy module + ClpXP control module, 2026-01-16"
    instruments: [platereader]
    plate_format: 384
    added_for: >
      Three things no other fixture carries. A sub-mix (3X Energy Mix) defined
      on the same page as the reactions drawing on it, so it is genuinely
      expandable. One cell reading "11.67 (3.5 tRNA) (8.17)" -- two equivalent
      formulations in a single cell, where 8.17 + 3.5 = 11.67 and tRNA is 30%
      of the mix; any parser takes the first number and silently discards the
      alternative. And a premix named "Energy solution-CP" that contains no
      creatine phosphate, so its name asserts something false about its
      contents.
    findings:
      - check: nested_mastermix_expansion
        tier: confirmed
        expected: pass
      - check: multi_valued_cell
        tier: asserted
        expected: warn

  - path: pending
    disclosure: pending
    origin: "platemap supplied directly by the experimentalist, PPK run, 2025-06-12"
    instruments: [platereader]
    plate_format: 384
    added_for: >
      A real bench layout, which no synthetic case reproduces: rows A, C, E,
      G, I and columns 19, 21, 23 -- every other well on both axes, and
      deliberately on the plate edge in row A. It is the counter-example to
      any check that treats a tidy layout as suspicious, and the reference for
      what real spacing looks like. Also a minimal platemap: Well, Experiment,
      Name and a binary design-factor column, with no Date, Type or volume.
    findings:
      - check: edge_margin
        tier: confirmed
        expected: warn
      - check: has_well_column
        tier: confirmed
        expected: pass

  - path: pending
    disclosure: pending
    origin: "kinetics intro devnote, experiments/platemap.csv"
    instruments: [platereader]
    plate_format: 384
    added_for: >
      Dates written 11/19/25 across nine rows. Resolvable as a day, since 19
      is not a month, but the century is not -- so it exercises the milder
      half of the date rule against ambiguous-date.csv's severe half.
    findings:
      - check: date_format
        tier: confirmed
        expected: warn
