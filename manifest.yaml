# nucleus-platemap-corpus manifest
#
# Each entry records WHY a fixture is in this corpus.
# A file added because it "looks representative" is one nobody maintains.
#
# Fields:
#   path        relative to corpus root once vendored; "pending" if not yet added
#   disclosure  pending | cleared
#   origin      where the file came from
#   instruments list — platereader, microscope, or both
#   plate_format 96 | 384 | etc.
#   added_for   the specific finding or failure mode this file exercises
#   findings    list of expected check results
#     check     the check name in check-platemap.py
#     tier      derived | confirmed | asserted
#               derived   — correct by construction; always gates CI
#               confirmed — human-verified against the real data; gates CI
#               asserted  — one agent's output, not independently verified; never gates CI
#     expected  blocking | warn | info | pass
#
# Tiers derived and confirmed may fail a build.
# Tier asserted never gates CI — it records a hypothesis, not a fact.

corpus:

  # ── Real fixtures (staged for disclosure) ─────────────────────────────────

  - path: pending
    disclosure: pending
    origin: "bench sheet, ClpXP kinetics run, 2026-09"
    instruments: [platereader]
    plate_format: 384
    added_for: >
      Cells rows uniformly rescaled ÷3 from source (30 µL → 10 µL).
      Concentrations survive the rescaling so every arithmetic check passes,
      but the recorded volumes are not what was pipetted. Caught by
      cross-comparison between two agents' outputs, not by any check.
    findings:
      - check: undeclared_uniform_volume_ratio
        tier: confirmed
        expected: blocking
      - check: well_coverage
        tier: confirmed
        expected: pass

  - path: pending
    disclosure: pending
    origin: "bench sheet, 2026-08"
    instruments: [platereader]
    plate_format: 96
    added_for: >
      13 of 20 wells present in the plate grid were absent from the written
      condition table. The CDK inner join would have analysed one third of
      the run and reported nothing wrong. No error is raised.
    findings:
      - check: well_coverage
        tier: confirmed
        expected: blocking

  - path: pending
    disclosure: pending
    origin: "Notion ELN, 2026-09"
    instruments: [platereader]
    plate_format: 96
    added_for: >
      Type column contains "Standard" meaning "the standard prep method".
      The CDK reads this as a calibration standard and excludes those wells
      from kinetics. Passes every syntactic check; silently wrong.
    findings:
      - check: type_value_semantic
        tier: asserted
        expected: blocking

  - path: pending
    disclosure: pending
    origin: "Notion ELN, 2026-09"
    instruments: [platereader]
    plate_format: 96
    added_for: >
      Recipe column headed "Volume for one reaction [µL]" sums to 35 µL
      for a declared 10 µL reaction. Six of nine components disagree with
      the stated basis when back-calculated. Mg-Acetate implies 28 mM
      against a stated 8 mM.
    findings:
      - check: recipe_volume_sum
        tier: confirmed
        expected: blocking

  - path: fixtures/real/clpxp-stacked-bench-sheet.csv
    disclosure: cleared
    origin: "Notion ELN, PPK-energy-module / ClpXP-control-module integration, 2026-01-16 data, dry run 2026-09-01"
    instruments: [platereader]
    plate_format: pending
    added_for: >
      Stacked bench sheet — four recipe tables in one CSV with no Well
      column. Input for extract-conditions, not a platemap yet. Exercises
      three distinct parsing cases: (1) nested master mix (3X Energy Mix
      expands into Energy solution-CP in each reaction — the sub-recipe
      expansion the PR notes as unimplemented); (2) mixed unit notation
      across columns (×, mM, ng/µL, uM, and mm — lowercase mm is likely
      a typo for mM in the PolyP rows); (3) embedded parenthetical in a
      volume cell ("11.67 (3.5 tRNA) (8.17)" documents the breakdown
      inside the value itself).
    findings:
      - check: has_well_column
        tier: confirmed
        expected: pass
        note: >
          No Well column is correct here — this is source material for
          extract-conditions, not a finished platemap.
      - check: unit_consistency
        tier: confirmed
        expected: warn
        note: "mm on PolyP rows is likely a typo for mM"
      - check: nested_mastermix_expansion
        tier: asserted
        expected: warn
        note: "3X Energy Mix sub-recipe not yet expanded by build-platemap"

  # ── Synthetic adversarial cases (no disclosure issue) ─────────────────────
  # Generated by mutating a clean file to trigger one blocking rule each.
  # Tier is derived — correct by construction — so these always gate CI.

  - path: fixtures/synthetic/leading-zero-well.csv
    disclosure: cleared
    origin: "generated"
    added_for: >
      Well IDs with leading zeros (A01 vs A1). The CDK emits A1; a leading
      zero causes a silent inner-join miss with no error reported.
    findings:
      - check: well_id_format
        tier: derived
        expected: blocking

  - path: fixtures/synthetic/off-plate-well.csv
    disclosure: cleared
    origin: "generated"
    added_for: >
      Well ID that does not exist on the declared plate format (e.g. A25 on
      a 96-well plate). Silently dropped by the inner join.
    findings:
      - check: well_id_in_plate
        tier: derived
        expected: blocking

  - path: fixtures/synthetic/duplicate-well.csv
    disclosure: cleared
    origin: "generated"
    added_for: >
      Two rows sharing the same Well value. The join produces duplicate
      result rows with no warning.
    findings:
      - check: duplicate_wells
        tier: derived
        expected: blocking
